name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go and MySQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: researchpilot_ci
          MYSQL_ROOT_HOST: '%'
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -pci-only-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l cmd internal)"
          if [ -n "$files" ]; then
            printf 'Run gofmt on:\n%s\n' "$files"
            exit 1
          fi
      - run: go mod verify
      - run: go vet ./...
      - name: Unit tests with race detector
        run: go test -race -count=1 -timeout=3m ./...
      - name: Create ephemeral model encryption key
        run: |
          umask 077
          openssl rand -hex 32 > "$RUNNER_TEMP/model-master.key"
      - name: Migration and durable execution integration tests
        env:
          TEST_REDIS_ADDR: 127.0.0.1:6379
          TEST_MYSQL_DSN: root:ci-only-password@tcp(127.0.0.1:3306)/researchpilot_ci
          MODEL_MASTER_KEY_FILE: ${{ runner.temp }}/model-master.key
          MIGRATIONS_DIR: ${{ github.workspace }}/migrations
        run: |
          go test -race -count=1 -timeout=2m ./internal/persistence/migrations -run '^TestMigrationsIntegration$' -v
          go test -race -count=1 -timeout=3m ./... -v
      - name: Remove ephemeral key
        if: always()
        run: rm -f "$RUNNER_TEMP/model-master.key"

  frontend:
    name: Web tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: node --test web/events.test.mjs
      - run: npm --prefix web run build

  smoke:
    name: Compose smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Create ephemeral Compose secret
        run: |
          mkdir -p .cache
          umask 077
          openssl rand -hex 32 > .cache/model-master.key
          # The application image runs as UID 65532.
          chmod 644 .cache/model-master.key
      - name: Build and start stack
        run: docker compose up --build -d
      - name: Wait for API
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/healthz; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"
          exit 1
      - name: Verify demo lifecycle, tenancy, idempotency and SSE
        shell: pwsh
        run: ./scripts/smoke.ps1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Browser smoke
        run: node scripts/browser-smoke.mjs
      - name: Container diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200
          if [ -f .cache/browser-startup.log ]; then tail -60 .cache/browser-startup.log; fi
      - name: Clean up isolated CI resources
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
          rm -f .cache/model-master.key

  production-smoke:
    name: Production Compose smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: bash scripts/smoke-production.sh
